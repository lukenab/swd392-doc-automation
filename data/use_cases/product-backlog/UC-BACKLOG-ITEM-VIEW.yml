key: UC-BACKLOG-ITEM-VIEW
parent: UC-BACKLOG-ITEMS-MANAGE
group: PRODUCT_BACKLOG
order: 210
name: View Product Backlog Item
summary: View a Product Backlog Item's details, order, estimate, and related Sprint information.
created_by: Nguyễn Quốc Khánh
date_created: 2026-09-26
primary_actor: Project Member
secondary_actors: []
trigger: A Project Member selects a Product Backlog Item.
description: >
  This use case allows a Project Member to view a Product Backlog Item's details, order,
  estimate, and related Sprint information when available. The item is displayed without
  changes.
preconditions:
  - The Project Member is an active member of the project.
  - The Product Backlog Item exists.
postconditions:
  - The item is displayed without modification.
normal_flow:
  - actor: Project Member
    action: Selects a Product Backlog Item.
  - actor: System
    action: Retrieves the item's current information.
  - actor: System
    action: Displays the item details and related Sprint information.
alternative_flows: []
exceptions:
  - id: EX-01
    description: The selected item is no longer available.
priority: Must Have
frequency_of_use: Very Frequent
business_rules:
  - BR-PROJECT-MEMBER-ACCESS
other_information: Editing is handled by Update Product Backlog Item.
assumptions:
  - The Project Member can access the project's Product Backlog.
