key: UC-BACKLOG-ITEM-CREATE
parent: UC-BACKLOG-ITEMS-MANAGE
group: PRODUCT_BACKLOG
order: 220
name: Create Product Backlog Item
summary: Create a Product Backlog Item with its initial details.
created_by: Nguyễn Quốc Khánh
date_created: 2026-09-26
primary_actor: Product Owner
secondary_actors: []
trigger: The Product Owner chooses to add a Product Backlog Item.
description: >
  This use case allows the Product Owner to create a Product Backlog Item in an active
  project. The item contains its initial details and may be saved as a draft when it is
  not ready for Sprint planning. Estimation is handled separately.
preconditions:
  - The actor holds Product Owner accountability in the project.
  - The project is active.
postconditions:
  - A new Product Backlog Item is stored in the Product Backlog.
  - The creation is recorded in item activity history.
normal_flow:
  - actor: Product Owner
    action: Chooses to create a Product Backlog Item.
  - actor: System
    action: Requests the title, description, acceptance criteria, and item type.
  - actor: Product Owner
    action: Provides the required information and confirms creation.
  - actor: System
    action: Validates and stores the new item.
alternative_flows:
  - id: AF-01
    condition: The Product Owner saves incomplete information as a draft item.
    steps:
      - The system stores the item but does not mark it ready for Sprint planning.
exceptions:
  - id: EX-01
    description: Required identifying information, at least the title, is missing; this applies to complete items and to drafts.
priority: Must Have
frequency_of_use: Frequent
business_rules:
  - BR-PRODUCT-OWNER-BACKLOG
  - BR-PROJECT-ARCHIVED-READ-ONLY
other_information: Estimation is handled separately by Estimate Backlog Item.
assumptions:
  - Product Backlog Items use system-generated identifiers.
