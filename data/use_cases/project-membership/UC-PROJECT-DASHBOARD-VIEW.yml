key: UC-PROJECT-DASHBOARD-VIEW
parent: UC-PROJECTS-MANAGE
group: PROJECT_MEMBERSHIP
order: 120
name: View Project Overview
summary: View a project's information, member count, and current Sprint summary.
created_by: Nguyễn An Bình
date_created: 2026-09-25
primary_actor: Project Member
secondary_actors: []
trigger: The Project Member selects a project from the list of participating projects.
description: >
  This use case allows a Project Member to view an overview of an accessible project. The
  overview includes project information, the member count, and the current Sprint summary.
  No project data is changed.
preconditions:
  - The actor is authenticated.
  - The actor is an active member of the selected project.
postconditions:
  - The current project overview is displayed.
  - No project data is modified.
normal_flow:
  - actor: Project Member
    action: Selects a project.
  - actor: System
    action: Verifies the actor's active project membership.
  - actor: System
    action: Retrieves project information, member count, and current Sprint summary.
  - actor: System
    action: Displays the project overview.
alternative_flows:
  - id: AF-01
    condition: The project is archived.
    steps:
      - The system displays the project overview in read-only mode.
exceptions:
  - id: EX-01
    description: The project no longer exists or the actor's membership has been removed.
priority: Must Have
frequency_of_use: Very Frequent
business_rules:
  - BR-PROJECT-MEMBER-ACCESS
  - BR-PROJECT-ARCHIVED-READ-ONLY
other_information: Detailed backlog and Sprint information is provided by their respective use cases.
assumptions:
  - Project summary data is updated when the project overview is requested.
