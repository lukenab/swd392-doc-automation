key: UC-PROJECT-MEMBER-ADD
parent: UC-PROJECT-MEMBERS-MANAGE
group: PROJECT_MEMBERSHIP
order: 420
name: Add Project Member
summary: Add an existing Staff member with an active account to an active project.
created_by: Nguyễn An Bình
date_created: 2026-09-26
primary_actor: Project Owner
secondary_actors: []
trigger: The Project Owner chooses to add a member to the project.
description: >
  This use case allows the Project Owner to add an existing Staff member with an active
  account to an active project. The added person becomes a Project Member. Scrum
  accountability is assigned separately.
preconditions:
  - The actor is the current Project Owner.
  - The project is active.
  - The target User account is active.
postconditions:
  - The target Staff member becomes an active Project Member.
  - The membership change is recorded in project activity history.
normal_flow:
  - actor: Project Owner
    action: Opens project membership management and chooses to add a member.
  - actor: System
    action: Requests an existing User account.
  - actor: Project Owner
    action: Selects the Staff member and confirms the addition.
  - actor: System
    action: Verifies that the Staff member is active and is not already a member.
  - actor: System
    action: Creates the membership and refreshes the member list.
alternative_flows:
  - id: AF-01
    condition: The selected Staff member is already a project member.
    steps:
      - The system reports that no new membership is required.
exceptions:
  - id: EX-01
    description: The selected User account becomes inactive before confirmation.
priority: Must Have
frequency_of_use: Occasional
business_rules:
  - BR-ACTIVE-USER-REQUIRED
  - BR-PROJECT-OWNER-ADMINISTRATION
other_information: Scrum accountability is assigned separately after membership is created.
assumptions:
  - Staff member discovery is limited to accounts that may be added to the project.
