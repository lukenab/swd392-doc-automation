key: UC-PROJECT-CREATE
group: PROJECT_MEMBERSHIP
order: 100
name: Create Project
summary: Create a Scrum project and assign the creator as its Project Owner.
created_by: Tran Cong Luan
date_created: 2026-09-25
primary_actor: User
secondary_actors: []
trigger: The User chooses to create a new project.
description: >
  This use case allows an active User to create a Scrum project, provide its
  initial information, and become the project's first Project Owner.
preconditions:
  - The User is authenticated.
  - The User account is active.
postconditions:
  - A new active project is created.
  - The creator becomes the sole Project Owner.
  - An empty Product Backlog and default Sprint Board are initialized.
normal_flow:
  - actor: User
    action: Starts project creation.
  - actor: System
    action: Requests the project name, description, and planned dates.
  - actor: User
    action: Provides the required project information and confirms creation.
  - actor: System
    action: Validates the submitted information.
  - actor: System
    action: Creates the project and assigns ownership to the User.
  - actor: System
    action: Initializes the Product Backlog and default Sprint Board.
alternative_flows:
  - id: AF-01
    condition: Required project information is missing or invalid.
    steps:
      - The system identifies the invalid information.
      - The User corrects the information and submits it again.
exceptions:
  - id: EX-01
    description: The project cannot be created because project data cannot be persisted.
priority: Must Have
frequency_of_use: Occasional
business_rules:
  - BR-ACTIVE-USER-REQUIRED
  - BR-PROJECT-ONE-OWNER
other_information: Project creation does not automatically create a Sprint.
assumptions:
  - The default Sprint Board statuses are To Do, In Progress, and Done.
