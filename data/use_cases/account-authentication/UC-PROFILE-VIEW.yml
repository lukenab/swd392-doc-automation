key: UC-PROFILE-VIEW
parent: UC-PROFILE-MANAGE
group: ACCOUNT_AUTHENTICATION
order: 510
name: View Personal Profile
summary: View the signed-in Staff member's profile and account information.
created_by: Trần Công Luận
date_created: 2026-09-26
primary_actor: Staff
secondary_actors: []
trigger: The Staff member opens their personal profile.
description: >
  This use case allows a Staff member to view their own profile and account information.
  The information is displayed without changes, and sensitive authentication information
  is not shown.
preconditions:
  - The Staff member is authenticated with an active account.
postconditions:
  - The Staff member's current profile information is displayed without modification.
normal_flow:
  - actor: Staff
    action: Opens the personal profile page.
  - actor: System
    action: Retrieves the profile belonging to the authenticated Staff member.
  - actor: System
    action: Displays the Staff member's profile and non-sensitive account information.
alternative_flows: []
exceptions:
  - id: EX-01
    description: The profile information is temporarily unavailable.
priority: Must Have
frequency_of_use: Occasional
business_rules:
  - BR-AUTH-ACTIVE-ACCOUNT
  - BR-PROFILE-SELF-ACCESS
other_information: Password values and password-reset tokens are never displayed.
assumptions:
  - The authenticated account has an existing profile.
