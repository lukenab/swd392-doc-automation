key: UC-ACCOUNT-REGISTER
group: ACCOUNT_AUTHENTICATION
order: 100
name: Register Account
summary: Create a website account using email and password, with email verification required for activation.
created_by: Trần Công Luận
date_created: 2026-09-26
primary_actor: Guest
secondary_actors:
  - Email Service
trigger: The Guest chooses to create a system-wide account.
description: >
  This use case allows a Guest to register a website account using an email address and
  password. The account is activated after successful email verification. Registration
  does not automatically grant project membership.
preconditions:
  - The Guest is not authenticated.
  - The Guest can access the submitted email account.
postconditions:
  - One active User account is linked to the verified email address.
  - The new Staff member is not automatically a member of any project.
normal_flow:
  - actor: Guest
    action: Opens account registration and chooses email and password.
  - actor: System
    action: Requests the display name, email address, and password.
  - actor: Guest
    action: Provides the required registration information.
  - actor: System
    action: Validates the information, email uniqueness, and password strength.
  - actor: System
    action: Creates a pending account.
  - actor: System
    action: Requests an email verification message for the account.
  - actor: Email Service
    action: Delivers the verification message to the submitted email address.
  - actor: Guest
    action: Opens the valid verification link.
  - actor: System
    action: Activates the User account and confirms registration.
alternative_flows:
  - id: AF-01
    condition: At Normal Flow Step 4, the email/password registration information is invalid or the email address is already in use.
    steps:
      - The system identifies the invalid information or duplicate email and requests correction.
      - The Guest corrects and resubmits the registration information.
      - Return to Normal Flow Step 4 for validation.
exceptions:
  - id: EX-01
    description: "At Normal Flow Step 7, if the Email Service cannot deliver the verification message, the account remains pending. The Guest may request another verification message; the account is not activated until verification succeeds."
  - id: EX-02
    description: "At Normal Flow Step 5, if the pending account record cannot be saved, no new User account is created."
  - id: EX-03
    description: "At Normal Flow Step 8, if the verification link is invalid or expired, the account remains pending. The Guest may request another verification message; the account is not activated until verification succeeds."
priority: Must Have
frequency_of_use: Rare
business_rules:
  - BR-ACCOUNT-EMAIL-UNIQUE
  - BR-ACCOUNT-NO-PROJECT-AUTO-MEMBERSHIP
  - BR-ACCOUNT-VERIFIED-IDENTITY
  - BR-PASSWORD-STRENGTH
other_information: Registration is self-service; a System Administrator does not create the account through this use case. First-time registration through Google is handled by UC-02 Log In.
assumptions:
  - Email/password authentication is configured through a managed authentication provider.
