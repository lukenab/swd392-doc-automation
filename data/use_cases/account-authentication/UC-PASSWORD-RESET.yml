key: UC-PASSWORD-RESET
group: ACCOUNT_AUTHENTICATION
order: 400
name: Reset Password
summary: Replace a forgotten locally managed password through a secure email link.
created_by: Nguyen An Binh
date_created: 2026-09-26
primary_actor: User
secondary_actors:
  - Email Service
trigger: The User selects Forgot Password from the sign-in page.
description: >
  This use case allows a User with a locally managed password to request a
  time-limited email link and set a new password without an authenticated session.
preconditions:
  - The password-reset page and Email Service are available.
  - The requester can access the submitted email address if it belongs to an eligible account.
postconditions:
  - If a valid reset is completed, the new password replaces the previous password.
  - The used reset token is invalidated.
  - Project memberships and project data remain unchanged.
normal_flow:
  - actor: User
    action: Opens password reset and submits an email address.
  - actor: System
    action: Displays the same generic response regardless of whether the account exists.
  - actor: System
    action: Generates a single-use expiring token when the email belongs to an eligible password account.
  - actor: Email Service
    action: Delivers the password-reset link to the eligible email address.
  - actor: User
    action: Opens the valid link and submits a new password.
  - actor: System
    action: Validates the token and password strength, updates the password, and invalidates the token.
alternative_flows:
  - id: AF-01
    condition: The reset token is invalid, expired, or already used.
    steps:
      - The system rejects the password change.
      - The system allows the User to submit a new reset request.
  - id: AF-02
    condition: The account uses Google only and has no locally managed password.
    steps:
      - The system keeps the generic response and does not create a reset token.
      - The User continues to authenticate through Google.
exceptions:
  - id: EX-01
    description: The Email Service cannot deliver the reset message; the failure is recorded without exposing account existence.
  - id: EX-02
    description: The account status changes before the new password is saved; the reset is rejected.
priority: Must Have
frequency_of_use: Rare
business_rules:
  - BR-PASSWORD-STRENGTH
  - BR-PASSWORD-RESET-TOKEN
  - BR-PASSWORD-RESET-PRIVACY
other_information: Reset Password applies only to locally managed passwords; it does not reset a Google password.
assumptions:
  - The managed authentication provider securely generates and validates password-reset tokens.
