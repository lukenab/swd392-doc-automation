key: UC-PROFILE-UPDATE
parent: UC-PROFILE-MANAGE
group: ACCOUNT_AUTHENTICATION
order: 520
name: Update Personal Profile
summary: Update the signed-in Staff member's editable profile information.
created_by: Trần Công Luận
date_created: 2026-09-26
primary_actor: Staff
secondary_actors: []
trigger: The Staff member chooses to edit their personal profile.
description: >
  This use case allows a Staff member to update their own editable profile information.
  Valid changes are saved and displayed in the profile. Password changes are handled
  separately.
preconditions:
  - The Staff member is authenticated with an active account.
postconditions:
  - Valid profile changes are stored for the authenticated Staff member.
normal_flow:
  - actor: Staff
    action: Opens profile editing.
  - actor: System
    action: Displays the current editable profile values.
  - actor: Staff
    action: Changes the desired values and submits the profile.
  - actor: System
    action: Validates and saves the profile changes.
  - actor: System
    action: Displays the updated profile.
alternative_flows:
  - id: AF-01
    condition: The Staff member cancels before saving.
    steps:
      - The system discards the unsaved changes.
exceptions:
  - id: EX-01
    description: One or more submitted values do not satisfy the configured format or length constraints.
priority: Should Have
frequency_of_use: Occasional
business_rules:
  - BR-AUTH-ACTIVE-ACCOUNT
  - BR-PROFILE-SELF-ACCESS
other_information: Changing the account password is handled by Change Password.
assumptions:
  - Editable profile fields are configured consistently for all Users.
