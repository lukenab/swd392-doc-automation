key: UC-PASSWORD-CHANGE
parent: UC-PROFILE-MANAGE
group: ACCOUNT_AUTHENTICATION
order: 530
name: Change Password
summary: Change the signed-in Staff member's password for email/password log-in.
created_by: Trần Công Luận
date_created: 2026-09-26
primary_actor: Staff
secondary_actors: []
trigger: The Staff member chooses to change their password from personal profile settings.
description: >
  This use case allows a Staff member to change the password used for email/password
  log-in by providing the current password and a valid new password. Accounts managed only
  through an external Identity Provider must change their password through that provider.
preconditions:
  - The Staff member is authenticated with an active account.
postconditions:
  - The new password replaces the previous password.
  - The password change is recorded as a security event.
normal_flow:
  - actor: Staff
    action: Enters the current password and a new password.
  - actor: System
    action: Verifies the current password.
  - actor: System
    action: Validates the new password against the password policy.
  - actor: Staff
    action: Confirms the password change.
  - actor: System
    action: Stores the new password securely and confirms success.
alternative_flows:
  - id: AF-01
    condition: The account is managed only through an external Identity Provider.
    steps:
      - The system informs the Staff member that the password must be changed through that provider.
exceptions:
  - id: EX-01
    description: The current password is incorrect.
  - id: EX-02
    description: The new password does not satisfy the configured password-strength requirements.
priority: Should Have
frequency_of_use: Rare
business_rules:
  - BR-AUTH-ACTIVE-ACCOUNT
  - BR-PASSWORD-STRENGTH
  - BR-PROFILE-SELF-ACCESS
other_information: This use case is distinct from Forgot Password, which is used when the Staff member cannot authenticate.
assumptions:
  - Password hashes are stored using the system's approved security mechanism.
