key: UC-PASSWORD-CHANGE
parent: UC-PROFILE-MANAGE
group: ACCOUNT_AUTHENTICATION
order: 530
name: Change Password
summary: Replace the signed-in User's current local password with a new password.
created_by: Nguyen An Binh
date_created: 2026-09-26
primary_actor: User
secondary_actors: []
trigger: The User chooses to change their password from personal profile settings.
description: This use case allows an authenticated User with a locally managed password to replace it securely.
preconditions:
  - The User is authenticated with an active account.
  - The account uses a locally managed password.
postconditions:
  - The new password replaces the previous password.
  - The password change is recorded as a security event.
normal_flow:
  - actor: User
    action: Enters the current password and a new password.
  - actor: System
    action: Verifies the current password.
  - actor: System
    action: Validates the new password against the password policy.
  - actor: User
    action: Confirms the password change.
  - actor: System
    action: Stores the new password securely and confirms success.
alternative_flows:
  - id: AF-01
    condition: The account is managed only through an external Identity Provider.
    steps:
      - The system informs the User that the password must be changed through that provider.
exceptions:
  - id: EX-01
    description: The current password is incorrect.
  - id: EX-02
    description: The new password does not satisfy the configured password-strength requirements.
priority: Should Have
frequency_of_use: Rare
business_rules:
  - BR-AUTH-ACTIVE-ACCOUNT
  - BR-PASSWORD-STRENGTH
  - BR-PROFILE-SELF-ACCESS
other_information: This use case is distinct from Reset Password, which is used when the User cannot authenticate.
assumptions:
  - Password hashes are stored using the system's approved security mechanism.
