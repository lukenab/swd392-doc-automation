key: UC-SIGN-OUT
group: ACCOUNT_AUTHENTICATION
order: 300
name: Log Out
summary: Log out of the current session without affecting sessions on other clients.
created_by: Trần Công Luận
date_created: 2026-09-26
primary_actor: Staff
secondary_actors: []
trigger: The authenticated Staff member chooses to log out.
description: >
  This use case allows a Staff member to log out of the current client. The current
  session is ended and its local authentication information is removed. Sessions on other
  clients and project data remain unchanged.
preconditions:
  - The Staff member has an authenticated session in the current client.
postconditions:
  - The current session is invalidated.
  - Local authentication credentials for the current session are removed.
  - Other active sessions and project data remain unchanged.
normal_flow:
  - actor: Staff
    action: Requests to log out.
  - actor: System
    action: Invalidates the current session and its refresh credential.
  - actor: System
    action: Removes local authentication credentials and displays the public log-in page.
alternative_flows:
  - id: AF-01
    condition: The current session has already expired.
    steps:
      - The system removes any remaining local authentication credentials.
      - The system displays the public log-in page.
exceptions:
  - id: EX-01
    description: The server cannot revoke the current session; the client still removes local credentials and reports that remote revocation could not be confirmed.
priority: Must Have
frequency_of_use: Frequent
business_rules:
  - BR-LOG-OUT-SESSION
other_information: Logging out from one client does not log the Staff member out from other clients.
assumptions:
  - The client can remove its locally stored authentication credentials.
