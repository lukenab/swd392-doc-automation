key: UC-SIGN-OUT
group: ACCOUNT_AUTHENTICATION
order: 300
name: Sign Out
summary: End the current authenticated session without affecting other sessions.
created_by: Nguyen An Binh
date_created: 2026-09-26
primary_actor: User
secondary_actors: []
trigger: The authenticated User chooses to sign out.
description: >
  This use case ends the User's current authenticated session and removes the
  corresponding authentication credentials from the current client.
preconditions:
  - The User has an authenticated session in the current client.
postconditions:
  - The current session is invalidated.
  - Local authentication credentials for the current session are removed.
  - Other active sessions and project data remain unchanged.
normal_flow:
  - actor: User
    action: Requests to sign out.
  - actor: System
    action: Invalidates the current session and its refresh credential.
  - actor: System
    action: Removes local authentication credentials and displays the public sign-in page.
alternative_flows:
  - id: AF-01
    condition: The current session has already expired.
    steps:
      - The system removes any remaining local authentication credentials.
      - The system displays the public sign-in page.
exceptions:
  - id: EX-01
    description: The server cannot revoke the current session; the client still removes local credentials and reports that remote revocation could not be confirmed.
priority: Must Have
frequency_of_use: Frequent
business_rules:
  - BR-SIGN-OUT-SESSION
other_information: Signing out from one client does not sign the User out from other clients.
assumptions:
  - The client can remove its locally stored authentication credentials.
