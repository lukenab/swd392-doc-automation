key: UC-SUBTASK-UPDATE
parent: UC-SUBTASKS-MANAGE
group: SPRINT_WORK
order: 530
name: Update Subtask
summary: Revise the work details or assignee of an existing subtask.
created_by: Nguyen Quoc Khanh
date_created: 2026-09-26
primary_actor: User
secondary_actors: []
trigger: A Developer chooses to edit an existing subtask.
description: This use case allows a Developer to maintain the details of a subtask in the active Sprint.
preconditions:
  - The User holds Developer accountability in the project.
  - The subtask's parent task belongs to the active Sprint.
postconditions:
  - Valid subtask changes are stored.
  - Parent-task progress is recalculated when relevant.
normal_flow:
  - actor: User
    action: Opens a subtask for editing.
  - actor: System
    action: Displays its current editable values.
  - actor: User
    action: Revises the information and submits the subtask.
  - actor: System
    action: Validates and saves the changes.
alternative_flows:
  - id: AF-01
    condition: The User cancels editing.
    steps:
      - The system keeps the subtask unchanged.
exceptions:
  - id: EX-01
    description: The parent task is no longer part of the active Sprint.
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-SPRINT-TASK-ACTIVE-SPRINT
  - BR-SPRINT-TASK-DEVELOPER
  - BR-SUBTASK-SINGLE-LEVEL
other_information: Completion status is handled by Complete Subtask.
assumptions:
  - Concurrent subtask updates are detected by the system.
