key: UC-SPRINT-TASK-VIEW
parent: UC-SPRINT-TASKS-MANAGE
group: SPRINT_WORK
order: 210
name: View Sprint Task
summary: View a Sprint Task's details, status, assignment, and dependencies.
created_by: Nguyễn Tấn Trung
date_created: 2026-09-26
primary_actor: Project Member
secondary_actors: []
trigger: A Project Member selects a Sprint Task.
description: >
  This use case allows a Project Member to view an accessible Sprint Task's details,
  status, assignment, dependencies, and activity summary. The task is displayed without
  changes.
preconditions:
  - The Project Member is an active member of the project.
  - The Sprint Task exists in a Sprint accessible to the Staff member.
postconditions:
  - Current Sprint Task information is displayed without modification.
normal_flow:
  - actor: Project Member
    action: Selects a Sprint Task.
  - actor: System
    action: Retrieves the task details, assignment, dependencies, and activity summary.
  - actor: System
    action: Displays the Sprint Task.
alternative_flows: []
exceptions:
  - id: EX-01
    description: The selected Sprint Task is no longer available.
priority: Must Have
frequency_of_use: Very Frequent
business_rules:
  - BR-PROJECT-MEMBER-ACCESS
other_information: Task changes are handled by the corresponding concrete management use cases.
assumptions:
  - The Project Member can access the Sprint containing the task.
