key: UC-SPRINT-TASK-CREATE
parent: UC-SPRINT-TASKS-MANAGE
group: SPRINT_WORK
order: 220
name: Create Sprint Task
summary: Create an executable task for a Product Backlog Item in the active Sprint.
created_by: Nguyen Quoc Khanh
date_created: 2026-09-26
primary_actor: User
secondary_actors: []
trigger: A Developer decides that a Sprint Backlog Item requires a new task.
description: This use case allows a Developer to define a new Sprint Task and its initial work information.
preconditions:
  - The User holds Developer accountability in the project.
  - The project has an active Sprint.
  - The related Product Backlog Item belongs to the active Sprint.
postconditions:
  - A new Sprint Task is associated with the selected Product Backlog Item.
  - The creation is recorded in work item activity.
normal_flow:
  - actor: User
    action: Chooses to create a task for a Sprint Backlog Item.
  - actor: System
    action: Requests the task title and initial work details.
  - actor: User
    action: Provides the task information and confirms creation.
  - actor: System
    action: Validates and stores the Sprint Task.
alternative_flows: []
exceptions:
  - id: EX-01
    description: The related Product Backlog Item no longer belongs to the active Sprint.
priority: Must Have
frequency_of_use: Frequent
business_rules:
  - BR-SPRINT-TASK-ACTIVE-SPRINT
  - BR-SPRINT-TASK-DEVELOPER
other_information: Assignment can be supplied during creation or performed later.
assumptions:
  - A Sprint Task belongs to one Product Backlog Item.
