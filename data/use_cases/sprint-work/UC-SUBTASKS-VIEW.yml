key: UC-SUBTASKS-VIEW
parent: UC-SUBTASKS-MANAGE
group: SPRINT_WORK
order: 510
name: View Subtasks
summary: Review the subtasks and completion state of a Sprint Task.
created_by: Nguyen Quoc Khanh
date_created: 2026-09-26
primary_actor: User
secondary_actors: []
trigger: A Project Member opens the subtask list of a Sprint Task.
description: This use case displays the subtasks of an accessible parent task without modifying them.
preconditions:
  - The User is an active member of the project.
  - The parent Sprint Task exists.
postconditions:
  - Current subtasks and their statuses are displayed without modification.
normal_flow:
  - actor: User
    action: Opens a Sprint Task's subtask section.
  - actor: System
    action: Retrieves and displays the existing subtasks.
alternative_flows:
  - id: AF-01
    condition: The parent task has no subtasks.
    steps:
      - The system displays an empty subtask list.
exceptions: []
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-PROJECT-MEMBER-ACCESS
other_information: Subtask modification requires Developer accountability.
assumptions:
  - The User can access the parent Sprint Task.
