key: UC-TASK-DEPENDENCY-REMOVE
parent: UC-SPRINT-TASKS-MANAGE
group: SPRINT_WORK
order: 270
name: Remove Task Dependency
summary: Remove an existing task dependency without deleting either task.
created_by: Nguyễn Tấn Trung
date_created: 2026-09-26
primary_actor: Developer
secondary_actors: []
trigger: A Developer determines that an existing task dependency is no longer required.
description: >
  This use case allows a Developer to remove an existing dependency between tasks. Neither
  task is deleted, and their statuses remain unchanged. The removal is recorded in work
  item activity history.
preconditions:
  - The actor holds Developer accountability in the project.
  - The selected dependency exists.
postconditions:
  - The selected dependency relationship no longer affects the tasks.
  - The removal is recorded in work item activity.
normal_flow:
  - actor: Developer
    action: Opens a Sprint Task and selects an existing dependency.
  - actor: Developer
    action: Requests removal of the dependency.
  - actor: System
    action: Requests confirmation and displays the affected tasks.
  - actor: Developer
    action: Confirms removal.
  - actor: System
    action: Removes the relationship and records the change.
alternative_flows:
  - id: AF-01
    condition: The Developer cancels before confirmation.
    steps:
      - The system leaves the dependency unchanged.
exceptions:
  - id: EX-01
    description: The dependency was already removed by another Staff member.
priority: Should Have
frequency_of_use: Occasional
business_rules:
  - BR-SPRINT-TASK-DEVELOPER
  - BR-TASK-DEPENDENCY-SAME-PROJECT
other_information: Removing a dependency does not modify either task's status.
assumptions:
  - The Developer understands the planning impact of the removal.
