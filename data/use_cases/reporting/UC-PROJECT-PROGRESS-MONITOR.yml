key: UC-PROJECT-PROGRESS-MONITOR
group: REPORTING
order: 100
name: Monitor Project Progress
summary: View task statistics, overdue work, and completion progress for a project.
created_by: Nguyen Thien Tanh
date_created: 2026-09-24
primary_actor: Project Manager
secondary_actors:
  - Project Member
trigger: The actor opens the project dashboard.
description: >
  This use case provides a project-level view of task distribution by status,
  overdue tasks, and overall completion progress.
preconditions:
  - The actor is an active member of the project.
  - The project exists.
postconditions:
  - The latest project progress information is displayed.
normal_flow:
  - actor: Project Member
    action: Opens the project dashboard.
  - actor: System
    action: Calculates task counts by status and overdue condition.
  - actor: System
    action: Displays completion progress and overdue tasks.
alternative_flows:
  - id: AF-01
    condition: The project does not contain any tasks.
    steps:
      - The system displays zero progress and an empty-state message.
exceptions: []
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-ARCHIVED-PROJECT-READ-ONLY
other_information: Completion percentage is based on tasks in the Done column.
assumptions:
  - Board columns are correctly mapped to task status.
