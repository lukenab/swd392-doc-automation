key: UC-PROJECT-ARCHIVE
order: 900
name: Archive Project
summary: Archive an inactive project while preserving its historical data.

created_by: Tran Cong Luan
date_created: 2026-09-24

primary_actor: Project Manager
secondary_actors:
  - Project Member

trigger: The Project Manager selects the Archive Project option.

description: >
  This use case allows a Project Manager to archive a project
  that is no longer active while preserving its tasks, members,
  comments, and progress history.

preconditions:
  - The user is authenticated.
  - The project exists.
  - The user is the Project Manager of the project.
  - The project is currently active.

postconditions:
  - The project is marked as archived.
  - Project data is preserved.
  - Project members can no longer modify the project.

normal_flow:
  - actor: Project Manager
    action: Opens the project settings.
  - actor: Project Manager
    action: Selects the Archive Project option.
  - actor: System
    action: Displays a confirmation message.
  - actor: Project Manager
    action: Confirms the archive operation.
  - actor: System
    action: Marks the project as archived.
  - actor: System
    action: Displays a successful archive notification.

alternative_flows:
  - The Project Manager cancels the confirmation and the project remains active.

exceptions:
  - The system cannot archive the project because of a server or database error.

priority: Should Have
frequency_of_use: Rare

business_rules: []

other_information: >
  An archived project remains available for viewing but cannot
  be modified until it is restored.

assumptions:
  - The project data has been saved successfully before archiving.
