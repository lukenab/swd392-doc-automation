id: UC-06
name: Move Task Between Columns
summary: Change task status by moving a task to another workflow column.
created_by: Nguyen Tan Trung
date_created: 2026-09-24
primary_actor: Project Member
secondary_actors:
  - Project Manager
trigger: The actor drags a task card to another board column.
description: >
  This use case allows a project participant to update task status by moving
  the task card between active workflow columns.
preconditions:
  - The actor is an active member of the project.
  - The project and task are active.
postconditions:
  - The task status matches the destination column.
  - The status change is recorded in activity history.
normal_flow:
  - actor: Project Member
    action: Drags a task card to another workflow column.
  - actor: System
    action: Validates the destination column and actor permission.
  - actor: System
    action: Updates the task status and board position.
  - actor: System
    action: Records the status change in activity history.
alternative_flows:
  - id: AF-01
    condition: The destination column was deactivated.
    steps:
      - The system rejects the change.
      - The system refreshes the current board configuration.
exceptions: []
priority: Must Have
frequency_of_use: Very Frequent
business_rules:
  - BR-06
  - BR-08
other_information: Drag and drop may be replaced by a status selector on mobile devices.
assumptions:
  - The client has loaded the latest board configuration.

