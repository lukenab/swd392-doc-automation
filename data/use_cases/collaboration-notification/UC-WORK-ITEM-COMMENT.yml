key: UC-WORK-ITEM-COMMENT
group: COLLABORATION_NOTIFICATION
order: 100
name: Comment on Work Item
summary: Add a discussion comment to a Product Backlog Item, task, or subtask.
created_by: Nguyen Tan Trung
date_created: 2026-09-25
primary_actor: User
secondary_actors:
  - Email Service
trigger: The Project Member needs to communicate about a work item.
description: >
  This use case allows project members to record contextual discussion on a
  work item and notify mentioned or relevant members.
preconditions:
  - The actor is an active member of the project.
  - The work item exists and is accessible to the actor.
postconditions:
  - The comment is attached to the work item.
  - Relevant in-app notifications are created and eligible email deliveries are requested.
normal_flow:
  - actor: User
    action: Opens a work item and enters a comment.
  - actor: System
    action: Validates the comment and referenced members.
  - actor: User
    action: Submits the comment.
  - actor: System
    action: Saves the comment and records it in activity history.
  - actor: System
    action: Creates in-app notifications and requests email delivery for eligible mentioned or relevant members.
  - actor: Email Service
    action: Returns the email delivery result to the system.
alternative_flows:
  - id: AF-01
    condition: The comment contains no content.
    steps:
      - The system asks the actor to enter content.
exceptions:
  - id: EX-01
    description: The work item is removed before the comment is submitted.
  - id: EX-02
    description: An email notification cannot be delivered; the comment and in-app notification remain saved, and the failed delivery is recorded.
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-COMMENT-PROJECT-MEMBER
  - BR-ACTIVITY-IMMUTABLE
  - BR-NOTIFICATION-EMAIL-PREFERENCE
  - BR-NOTIFICATION-DELIVERY-INDEPENDENT
other_information: Comment editing and deletion are not included in Iteration 1.
assumptions:
  - Mentioned users are active members of the same project.
