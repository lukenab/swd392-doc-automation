key: UC-NOTIFICATIONS-REVIEW
group: COLLABORATION_NOTIFICATION
order: 300
name: Receive and Review Notifications
summary: Receive in-app and email notifications, and review notifications generated by relevant project events.
created_by: Nguyen Tan Trung
date_created: 2026-09-25
primary_actor: Project Member
secondary_actors:
  - Email Service
trigger: A relevant project event creates a notification, or the Project Member opens the notification center.
description: >
  This use case allows a project member to receive and review in-app notifications
  about assignments, mentions, status changes, approaching deadlines, and overdue
  work. When email delivery is enabled, the system also sends eligible email
  notifications to the member's verified email address.
preconditions:
  - The actor has an active system account.
postconditions:
  - A relevant in-app notification is retained for the intended recipient.
  - An eligible email notification is requested when email delivery is enabled.
  - Selected notifications may be marked as read.
  - No project work data is changed.
normal_flow:
  - actor: System
    action: Creates an in-app notification for each intended recipient when a relevant project event occurs.
  - actor: System
    action: Sends an email notification to each recipient who has enabled email delivery and has a verified email address.
  - actor: Email Service
    action: Returns the email delivery result to the system.
  - actor: Project Member
    action: Opens the notification center.
  - actor: System
    action: Displays the actor's notifications and email delivery preference in reverse chronological order.
  - actor: Project Member
    action: Selects a notification to review.
  - actor: System
    action: Marks it as read and displays its related project context.
alternative_flows:
  - id: AF-01
    condition: The actor chooses to mark all notifications as read.
    steps:
      - The system marks all visible notifications as read.
  - id: AF-02
    condition: The actor enables or disables email notification delivery.
    steps:
      - The system verifies that the actor has a verified email address when email delivery is enabled.
      - The system saves the updated email delivery preference.
exceptions:
  - id: EX-01
    description: The related project item is no longer accessible to the actor.
  - id: EX-02
    description: The Email Service cannot deliver an email notification; the system retains the in-app notification, records the failed delivery, and does not roll back the originating operation.
  - id: EX-03
    description: The email delivery preference cannot be saved; the previous preference remains unchanged.
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-NOTIFICATION-OWNER-ONLY
  - BR-NOTIFICATION-EMAIL-PREFERENCE
  - BR-NOTIFICATION-DELIVERY-INDEPENDENT
  - BR-PROJECT-MEMBER-ACCESS
other_information: Iteration 1 supports in-app and email notification delivery. Mobile push notifications remain outside scope.
assumptions:
  - Notification events are generated by other completed use cases.
  - Email delivery requires a verified email address and an available Email Service integration.
