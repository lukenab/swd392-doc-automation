key: UC-NOTIFICATIONS-REVIEW
group: COLLABORATION_NOTIFICATION
order: 300
name: Review Notifications
summary: Review in-app notifications generated by relevant project events.
created_by: Nguyen Tan Trung
date_created: 2026-09-25
primary_actor: User
secondary_actors: []
trigger: The Project Member opens the notification center.
description: >
  This use case allows a Project Member to review in-app notifications about
  assignments, mentions, status changes, approaching deadlines, and overdue work.
preconditions:
  - The actor has an active system account.
postconditions:
  - Selected notifications may be marked as read.
  - The email delivery preference may be updated.
  - No project work data is changed.
normal_flow:
  - actor: User
    action: Opens the notification center.
  - actor: System
    action: Displays the actor's notifications and email delivery preference in reverse chronological order.
  - actor: User
    action: Selects a notification to review.
  - actor: System
    action: Marks it as read and displays its related project context.
alternative_flows:
  - id: AF-01
    condition: The actor chooses to mark all notifications as read.
    steps:
      - The system marks all visible notifications as read.
  - id: AF-02
    condition: The actor enables or disables email notification delivery.
    steps:
      - The system verifies that the actor has a verified email address when email delivery is enabled.
      - The system saves the updated email delivery preference.
exceptions:
  - id: EX-01
    description: The related project item is no longer accessible to the actor.
  - id: EX-02
    description: The email delivery preference cannot be saved; the previous preference remains unchanged.
priority: Should Have
frequency_of_use: Frequent
business_rules:
  - BR-NOTIFICATION-OWNER-ONLY
  - BR-PROJECT-MEMBER-ACCESS
  - BR-NOTIFICATION-EMAIL-PREFERENCE
other_information: Notification generation and email delivery are handled by the use cases that produce the relevant project events. Email delivery is included in Iteration 1 scope; push delivery remains outside Iteration 1 scope.
assumptions:
  - Notification events are generated by other completed use cases.
  - Email notification delivery requires a verified email address and an available Email Service integration.
