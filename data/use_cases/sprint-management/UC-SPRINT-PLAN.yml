key: UC-SPRINT-PLAN
group: SPRINT_MANAGEMENT
order: 100
name: Plan Sprint
summary: Prepare a Draft Sprint with a proposed Sprint Goal and selected Product Backlog Items.
created_by: Nguyen Tan Trung
date_created: 2026-09-25
primary_actor: User
secondary_actors: []
trigger: The Scrum Team is ready to prepare the next Sprint.
description: >
  This use case allows the Product Owner and Developers to prepare a Draft Sprint,
  agree on a proposed Sprint Goal, select ready Product Backlog Items, and establish
  an initial Sprint Backlog before activation.
preconditions:
  - Both actors are active project members with the stated Scrum accountabilities.
  - The project has no other Draft Sprint.
  - The Product Backlog contains at least one ready item.
postconditions:
  - A Draft Sprint exists with a proposed Sprint Goal, dates, and selected backlog items.
  - Selected items are associated with the Draft Sprint.
normal_flow:
  - actor: User
    action: Acting as the Product Owner, starts Sprint planning and proposes the Sprint Goal and date range.
  - actor: System
    action: Displays ordered Product Backlog Items that are ready for selection.
  - actor: User
    action: Acting as the Product Owner, proposes backlog items that support the Sprint Goal.
  - actor: User
    action: Acting as a Developer, reviews capacity, estimates, and item readiness.
  - actor: User
    action: Acting as the Product Owner, confirms the Sprint Goal and selected items with the Developer.
  - actor: System
    action: Creates the Draft Sprint and its initial Sprint Backlog.
alternative_flows:
  - id: AF-01
    condition: A selected item is not ready.
    steps:
      - The system identifies the missing readiness information.
      - The actors refine the item or remove it from the Sprint selection.
exceptions:
  - id: EX-01
    description: The Sprint cannot be saved because its date range conflicts with another Sprint.
priority: Must Have
frequency_of_use: Regular
business_rules:
  - BR-SPRINT-GOAL-REQUIRED
  - BR-SPRINT-DATE-RANGE
  - BR-BACKLOG-ITEM-READY
  - BR-SPRINT-ONE-DRAFT
other_information: Planning prepares a Draft Sprint but does not make it active.
assumptions:
  - The team discusses capacity before confirming the Sprint Backlog.
