key: UC-SPRINT-START
group: SPRINT_MANAGEMENT
order: 200
name: Start Sprint
summary: Activate a planned Sprint and make its Sprint Backlog available for execution.
created_by: Nguyen Tan Trung
date_created: 2026-09-25
primary_actor: Product Owner
secondary_actors:
  - Developer
trigger: The Scrum Team confirms that the planned Sprint is ready to begin.
description: >
  This use case changes a valid planned Sprint to active so Developers can
  execute and track the selected work on the Sprint Board.
preconditions:
  - The Sprint is in Planned status.
  - The Sprint has a goal, valid dates, and at least one selected item.
  - No other Sprint is active in the project.
postconditions:
  - The Sprint is active.
  - Its selected items are visible on the Sprint Board.
normal_flow:
  - actor: Product Owner
    action: Requests to start the planned Sprint.
  - actor: System
    action: Validates the Sprint Goal, dates, selected work, and active-Sprint constraint.
  - actor: Developer
    action: Confirms that the selected work is understood and executable.
  - actor: Product Owner
    action: Confirms Sprint activation.
  - actor: System
    action: Marks the Sprint active and opens its Sprint Board.
alternative_flows:
  - id: AF-01
    condition: The team changes the selection before activation.
    steps:
      - The Product Owner updates the selected backlog items.
      - The system revalidates the Sprint before activation.
exceptions:
  - id: EX-01
    description: Another Sprint is already active in the project.
priority: Must Have
frequency_of_use: Regular
business_rules:
  - BR-SPRINT-ONE-ACTIVE
  - BR-SPRINT-GOAL-REQUIRED
  - BR-SPRINT-DATE-RANGE
other_information: The Sprint start time is recorded in the activity history.
assumptions:
  - Planning has been completed before the Sprint is started.
