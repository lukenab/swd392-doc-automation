key: UC-SPRINT-START
parent: UC-SPRINTS-MANAGE
group: SPRINT_MANAGEMENT
order: 120
name: Start Sprint
summary: Start a valid Draft Sprint and make its selected work available on the Sprint Board.
created_by: Nguyễn Quốc Khánh
date_created: 2026-09-25
primary_actor: Product Owner
secondary_actors:
  - Developer
trigger: The Scrum Team confirms that the Draft Sprint is ready to begin.
description: >
  This use case allows the Product Owner to start a valid Draft Sprint after Developers
  confirm that the selected work is understood and ready for execution. The Sprint becomes
  active, and its selected items are available on the Sprint Board.
preconditions:
  - The Sprint is in Draft status.
  - The Sprint has a goal, valid dates, and at least one selected item.
postconditions:
  - The Sprint is active.
  - Its selected items are visible on the Sprint Board.
normal_flow:
  - actor: Product Owner
    action: Requests to start the Draft Sprint.
  - actor: System
    action: Validates the Sprint Goal, dates, selected work, and active-Sprint constraint.
  - actor: Developer
    action: Confirms that the selected work is understood and executable.
  - actor: Product Owner
    action: Confirms Sprint activation.
  - actor: System
    action: Marks the Sprint active and opens its Sprint Board.
alternative_flows:
  - id: AF-01
    condition: The team changes the selection before activation.
    steps:
      - The Product Owner updates the selected backlog items.
      - The system revalidates the Sprint before activation.
  - id: AF-02
    condition: The revalidation in AF-01 fails.
    steps:
      - The system reports the violated constraint and the Sprint remains in Draft status.
      - The Product Owner updates the selected backlog items again.
exceptions:
  - id: EX-01
    description: Another Sprint is already active in the project.
priority: Must Have
frequency_of_use: Regular
business_rules:
  - BR-SPRINT-ONE-ACTIVE
  - BR-SPRINT-GOAL-REQUIRED
  - BR-SPRINT-DATE-RANGE
other_information: The Sprint start time is recorded in the activity history.
assumptions:
  - Planning has been completed before the Sprint is started.
