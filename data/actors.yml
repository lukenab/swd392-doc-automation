actors:
  - key: visitor
    name: Visitor
    description: A person who has not signed in and may register a new system-wide account.
    side: left

  - key: system-administrator
    name: System Administrator
    description: Manages system-wide user accounts, audit information, and operational statistics.
    side: left

  - key: user
    name: User
    description: A person with a registered system-wide account who can sign in, create projects, and join projects with project-specific responsibilities.
    side: left

  - key: project-member
    name: Project Member
    description: A User who participates in a project and can access its shared Scrum information.
    side: left
    parent: user

  - key: project-owner
    name: Project Owner
    description: A Project Member who owns and administers one project.
    side: left
    parent: project-member

  - key: product-owner
    name: Product Owner
    description: A Project Member accountable for the Product Goal and effective Product Backlog management.
    side: left
    parent: project-member

  - key: developer
    name: Developer
    description: A Project Member who estimates backlog items and manages work needed to create a usable Increment.
    side: left
    parent: project-member

  - key: email-service
    name: Email Service
    description: An external delivery service that sends email notifications requested by the system and returns delivery results.
    side: right

  - key: identity-provider
    name: Identity Provider
    description: An external OAuth identity service, such as Google, that authenticates a person and returns a verified identity.
    side: right
