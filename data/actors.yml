actors:
  - key: visitor
    name: Visitor
    description: A person who has not signed in and may register a new system-wide account.
    side: left

  - key: system-administrator
    name: System Administrator
    description: Manages system-wide user accounts, audit information, and operational statistics.
    side: left

  - key: user
    name: User
    description: A person with a registered system-wide account. Within each project, the User may participate as a Project Member or Project Owner and may hold Product Owner or Developer accountability; these project-scoped assignments determine authorized actions.
    side: left

  - key: email-service
    name: Email Service
    description: An external delivery service that sends email notifications requested by the system and returns delivery results.
    side: right

  - key: identity-provider
    name: Identity Provider
    description: An external OAuth identity service, such as Google, that authenticates a person and returns a verified identity.
    side: right
