review_sections:
- title: Modelling conventions applied
  body: "- Authentication is a precondition only; Log In appears only in UC-SIGN-IN.\n- Partitions name the responsibility,\
    \ not the account type: Guest, User, Project Owner, Product Owner,\n  Developer, System Administrator, System,\
    \ Email Service, Identity Provider. A YAML step written as\n  \"Acting as the Product Owner/Developer\" is placed\
    \ in that role's partition.\n- Every action carries a trace comment (`' [NF2, POST1, BR-..., AF-01.1, EX-01]`)\
    \ that the validator checks\n  against the Use Case YAML. GUIDE-7.3 marks a System reject/report action added\
    \ because the YAML names an\n  exception but not its outcome.\n- Each exception ends with one System reject/report\
    \ action. Paths with the same outcome share one\n  Activity Final (see \"End-node policy\" below).\n- An alternative\
    \ flow resumes after the step where it was raised, or returns to the step it re-performs;\n  cancelling and\
    \ terminal alternative flows end the activity.\n- Validation failures that the YAML does not describe are not\
    \ drawn; they are listed as observations.\n"
- title: End-node policy (audit 2026-10-03)
  body: 'UML 2.5.1 allows several ActivityFinalNodes; the first one reached ends the whole activity. The team

    convention applied after the audit: (1) paths with the same outcome share one Activity Final, through merge

    nodes; (2) separate Activity Finals are kept only for different outcomes, and each one is explained in the

    header comment of the source; (3) when different outcomes occur on several nested branches (UC-01, UC-02,

    UC-30), one shared Activity Final is used, because separate finals would need duplicate finals for the same

    outcome; the last action on each path states the outcome; (4) UC-13 keeps two finals for the same outcome,

    because merging them would require drawing NF5 twice. No Flow Final is used. Details per end node:

    `docs/activity-diagram-audit-report.md`.

    '
- title: Preconditions contradicted by an alternative flow or exception
  body: 'When an exception or alternative flow describes a state that a precondition excludes, and the System can
    detect

    that state, it is drawn as a defensive System check and recorded as an observation. When an alternative flow

    needs the actor to start from a state that the preconditions exclude (UC-27.4), the use case is blocked as a

    requirement conflict, because drawing it would contradict the Use Case Description.

    '
- title: A4 legibility method
  body: 'The effective guard-text size is the SVG guard font (14 px = 10.5 pt) multiplied by the scale needed to
    fit the

    diagram into a 16.5 x 20.5 cm text area (A4 portrait, 2.25 cm margins, room for the caption). Diagrams below

    6 pt are marked `needs-manual-review`; all diagrams stay portrait and no landscape exception is used.

    '
- title: Deviation from the original guideline
  body: 'Section 6 of the earlier guideline named the actor partition "User". The Stage 2 instruction requires

    responsibility-specific partitions, so the guideline now uses the role names above. The PowerShell renderer

    scripts/render-activity-diagrams.ps1 is superseded by scripts/activity_diagrams.py and left unchanged.

    '
- title: PlantUML layout limitations found
  body: "- `repeat while ... is (...) not (...)` loses its guard labels with diamond conditions, so loops use `while`.\n\
    - `elseif` with vertical ifs draws hexagons, so multi-way choices are nested binary decisions.\n- `switch` and\
    \ `goto` do not render usable swimlane diagrams.\n- A decision branch that switches partition right below the\
    \ diamond is crossed by its own flow line; branches\n  are arranged so that the cross-partition branch leaves\
    \ the diamond horizontally.\n"
